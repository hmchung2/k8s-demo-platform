apiVersion: batch/v1
kind: CronJob
metadata:
  name: agg
  namespace: demo
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: agg
              image: postgres:15
              command:
                - bash
                - -lc
                - >
                  psql postgresql://$(PG_USER):$(PG_PASS)@$(PG_HOST):$(PG_PORT)/$(PG_DB)
                  -c "CREATE TABLE IF NOT EXISTS agg(n int);
                      INSERT INTO agg SELECT COUNT(*) FROM hits;"
              env:
                - { name: PG_USER, valueFrom: { configMapKeyRef: { name: app-config, key: PG_USER } } }
                - { name: PG_DB,   valueFrom: { configMapKeyRef: { name: app-config, key: PG_DB } } }
                - { name: PG_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: PG_HOST } } }
                - { name: PG_PORT, valueFrom: { configMapKeyRef: { name: app-config, key: PG_PORT } } }
                - { name: PG_PASS, valueFrom: { secretKeyRef: { name: pg-secret, key: POSTGRES_PASSWORD } } }
